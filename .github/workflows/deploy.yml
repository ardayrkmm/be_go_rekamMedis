name: Deploy Backend to VPS

on:
  push:
    branches:
      - main  # Ganti dengan 'master' jika branch utama Anda adalah master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21' # Sesuai dengan versi Go Anda, bisa diganti jika perlu

    - name: Build Aplikasi
      run: |
        GOOS=linux GOARCH=amd64 go build -o api_linux ./cmd/api
        
    - name: Deploy ke VPS via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "api_linux"
        target: "/var/www/backend_rekammedis/"

    - name: Restart Service di VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          chmod +x /var/www/backend_rekammedis/api_linux
          systemctl restart backend_rekammedis
