services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekammedis_backend
    restart: always
    environment:
      - APP_PORT=8001
      - DB_DSN=root:ardaganteng@tcp(rekammedis_db:3306)/rekam_medis?charset=utf8mb4&parseTime=True&loc=Local
      - GOOGLE_APPLICATION_CREDENTIALS=/app/rekamGo.json
    ports:
      - "8001:8001"
    networks:
      - rekammedis_net

networks:
  rekammedis_net:
    external: true
    name: rekammedis_net
