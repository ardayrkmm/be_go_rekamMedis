services:
  db:
    image: mysql:8.0
    container_name: rekammedis_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ardaganteng
      MYSQL_DATABASE: rekam_medis
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rekammedis_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: rekammedis_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ardaganteng
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - rekammedis_net

volumes:
  db_data:

networks:
  rekammedis_net:
    external: true
    name: rekammedis_net
